# Render Blueprint — Qura Healthcare Backend
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO DEPLOY:
#   1. Push this repo to GitHub.
#   2. On Render → New → Blueprint → connect this GitHub repo.
#   3. Render creates the backend web service + Redis.
#   4. In the backend service env vars, fill in:
#        DATABASE_URL  → your Neon PostgreSQL URL
#        CORS_ORIGINS  → comma-separated frontend Render URLs (set after frontend deploy)
#   5. After deploying frontends, copy the backend URL (e.g. https://qura-backend.onrender.com)
#      and set it as VITE_API_URL / VITE_SOCKET_URL in the frontend Render services.

services:
  # ── Backend API (Node.js + Express + Prisma) ──────────────────────────────
  - type: web
    name: qura-backend
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Required: paste your Neon PostgreSQL connection string
      - key: JWT_SECRET
        generateValue: true  # Auto-generated by Render (secure random value)
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: JWT_REFRESH_SECRET
        generateValue: true  # Auto-generated by Render
      - key: CORS_ORIGINS
        sync: false          # Required: set after frontend deploy (see step 5 above)
      - key: REDIS_URL
        fromService:
          type: redis
          name: qura-redis
          property: connectionString
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: AUTH_RATE_LIMIT_MAX
        value: 10

  # ── Redis (caching — app works without it, features gracefully degrade) ────
  - type: redis
    name: qura-redis
    plan: free
    ipAllowList: []
